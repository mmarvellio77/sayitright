<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SayItRight-Pronounciation Coach</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🎙️ SayItRight</h1>
      <p>Hear it. Say it. Get scored.</p>
      <small id="server">Connecting...</small>
    </header>

    <main>
      <p id="warning" class="'warning hidden"></p>
      <!--Search-->
      <form id="search-form">
        <input
          id="search-input"
          placeholder="Type an English word, e.g. thorough"
          required
        />
        <button>Look up</button>
      </form>
      <p class="hint">Try: <span id="suggestions"></span></p>
      <p id="error" class="error hidden"></p>
      <p id="loading" class="hidden">Loading...</p>

      <!--Word details and practice-->
      <div id="word-box" class="card-hidden">
        <h2 id="word"></h2>
        <p id="phonetic"></p>
        <button id="listen-btn">🔊 Listen</button>

        <p>
          Translate to:
          <select id="lang">
            <option value="">-- choose --</option>
            <option value="fr">French</option>
            <option value="sw">Swahili</option>
            <option value="rw">Kinyarwanda</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
          </select>
          <strong id="translation"></strong>
        </p>

        <div id="meanings"></div>

        <div class="practice">
          <h3>Your turn: say "<span id="target"></span>"</h3>
          <button id="mic-btn">Start speaking</button>
          <p id="result"></p>
        </div>
      </div>

      <!-- History -->
      <div class="card">
        <h2>My progress</h2>
        <div class="controls">
          <input id="history-search" placeholder="Search..." />
          <select id="history-filter">
            <option value="all">All</option>
            <option value="good">Mastered(80+)/option></option>
            <option value="bad">Needs practice (below 80)</option>
          </select>
          <select id="history-sort">
            <option value="date">Newest first</option>
            <option value="low">Lowest score first</option>
            <option value="high">Highest score first</option>
            <option value="az">A to Z</option>
          </select>
          <button id="clear-btn">Clear</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Word</th>
              <th>Best score</th>
              <th>Attempts</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </main>

    <footer>
      Data: <a href="https://dictionaryapi.dev/">Free Dictionary API</a> |
      <a href="https://mymemory.translated.net/">MyMemory</a> | Speech: Web
      Speech API
    </footer>
  </body>
</html>
